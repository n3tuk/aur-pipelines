---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: 3

tasks:
  go:healthcheck:
    desc: Check that the GoReleaser environment is valid
    summary: |-
      Run checks on both the local development or build environment to ensure that everything required is present, and
      also run a check on the GoReleaser configuration itself to ensure that it is valid.
    run: once
    internal: true
    silent: true
    sources:
      - .goreleaser.yaml
    deps:
      - task: check:exec:goreleaser
    cmds:
      - defer: "echo -e {{ if .EXIT_CODE }}'\e[1;31mFailed\e[0m'{{ else }}'\e[0;32mPassed\e[0m'{{ end }}"
      - cmd: goreleaser healthcheck
      - cmd: goreleaser check

  go:dirs:
    desc: Create the required directories for building/testing
    summary: |-
      Create any required directories needed as part of building and/or testing of the Go application, both locally, and
      within the integration pipeline.
    run: once
    internal: true
    silent: true
    cmds:
      - defer: "echo -e {{ if .EXIT_CODE }}'\e[1;31mFailed\e[0m'{{ else }}'\e[0;32mCompleted\e[0m'{{ end }}"
      - cmd: mkdir -p bin dist coverage/{unit,integration}
    status:
      - test -d bin
      - test -d dist
      - test -d coverage/unit
      - test -d coverage/integration

  go:modules:
    desc: Prepare the Go modules
    summary: |-
      Ensure that the local copies of any defined modules are kept up-to-date with those configured in this Go
      application.
    silent: true
    sources:
      - go.mod
      - go.sum
    deps:
      - task: check:exec:go
    cmds:
      - defer: "echo -e {{ if .EXIT_CODE }}'\e[1;31mFailed\e[0m'{{ else }}'\e[0;32mCompleted\e[0m'{{ end }}"
      - cmd: go mod download
      - cmd: go mod tidy

  go:build:
    aliases:
      - build
    desc: Locally build the application binary
    summary: |-
      Locally build the application binary for the testing and local development of the Go application with a temporary
      version number based on the local commit and file contents.
    silent: true
    sources:
      - go.mod
      - go.sum
      - main.go
      - "**/*.go"
      - .goreleaser.yaml
    deps:
      - task: go:healthcheck
      - task: go:dirs
      - task: go:modules
      - task: go:lint
      - task: go:test
    env:
      # GoReleaser's --single-target builds for the host GOAMD64 (default v1),
      # but .goreleaser.yaml pins the amd64 variant to v3; align them so the
      # requested single target matches a configured build on amd64 hosts.
      GOAMD64: v3
    cmds:
      - defer: "echo -e {{ if .EXIT_CODE }}'\e[1;31mFailed\e[0m'{{ else }}'\e[0;32mCompleted\e[0m'{{ end }}"
      - cmd: goreleaser build --clean --timeout 2m --snapshot --single-target --output bin/{{ .bin }}

  go:fmt:
    desc: Properly format all the .go files
    summary: |-
      Properly fomrmat all of the .go files using go (this is a write-based action which will make changes to all .go
      files, if required).
    silent: true
    sources:
      - main.go
      - "**/*.go"
    deps:
      - task: check:exec:go
    cmds:
      - defer: "echo -e {{ if .EXIT_CODE }}'\e[1;31mFailed\e[0m'{{ else }}'\e[0;32mCompleted\e[0m'{{ end }}"
      - cmd: go fmt ./...

  go:lint:
    desc: Check linting via golangci-lint
    summary: |-
      Run extensive linting tests and checks on the Go application using golangci-lint.
    silent: true
    sources:
      - main.go
      - "**/*.go"
      - .golangci.yaml
    deps:
      - task: check:exec:golangci-lint
      - task: go:fmt
      - task: go:modules
    cmds:
      - defer: "echo -e {{ if .EXIT_CODE }}'\e[1;31mFailed\e[0m'{{ else }}'\e[0;32mPassed\e[0m'{{ end }}"
      - cmd: golangci-lint --config '{{ .ROOT_DIR }}/.golangci.yaml' run

  go:schema:
    desc: Generate the JSON Schema for the aur-pipelines configuration file
    summary: |-
      Generate the JSON Schema for the aur-pipelines configuration file by running the generator tool at
      tools/schema/main.go. The schema is written to schemas/aur-pipelines.json. Run this task whenever the Config or
      Template structs in internal/config/config.go change.
    silent: true
    sources:
      - internal/config/config.go
      - tools/schema/main.go
    generates:
      - schemas/aur-pipelines.json
    deps:
      - task: check:exec:go
    cmds:
      - defer: "echo -e {{ if .EXIT_CODE }}'\e[1;31mFailed\e[0m'{{ else }}'\e[0;32mCompleted\e[0m'{{ end }}"
      - cmd: go run ./tools/schema/main.go

  go:test:
    desc: Run the unit tests for the application
    silent: true
    sources:
      - main.go
      - "**/*.go"
      - "**/testdata/*"
    deps:
      - task: check:exec:go
      - task: go:dirs
      - task: go:lint
    cmds:
      - defer: "echo -e {{ if .EXIT_CODE }}'\e[1;31mFailed\e[0m'{{ else }}'\e[0;32mPassed\e[0m'{{ end }}"
      - cmd: go test -v ./... -covermode=count -coverprofile=coverage.out
      - cmd: go tool cover -func=coverage.out
      - cmd: go tool cover -html=coverage.out -o=coverage.html

  go:clean:
    desc: Clean temporary directories and files from this function
    summary: |-
      Clean any temporary directories and files created by, or for, this Go application, as well as this Taskfile, and
      the tools and applications called from it.
    run: once
    silent: true
    cmds:
      - defer: "echo -e {{ if .EXIT_CODE }}'\e[1;31mFailed\e[0m'{{ else }}'\e[0;32mCompleted\e[0m'{{ end }}"
      - cmd: rm -rf dist
      - cmd: rm -f bin/{{ .bin }}
      - cmd: rm -rf coverage/*/*
      - cmd: rm -f coverage.out coverage.html
