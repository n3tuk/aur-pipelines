---
resource_types:
  - name: metadata
    type: registry-image
    source:
      repository: swce/metadata-resource
resources:
  - name: daily
    type: time
    icon: clock-outline
    source:
      interval: 24h
  - name: meta
    type: metadata
    icon: information-outline
jobs:
  - name: cleanup-repository
    serial: true
    plan:
      - get: daily
        trigger: true
      - get: meta
      - task: cleanup
        params:
          BUCKET: my-bucket
          R2_ACCESS_KEY_ID: ((r2.access-key-id))
          R2_ENDPOINT: https://((r2.account-id)).r2.cloudflarestorage.com
          R2_SECRET_ACCESS_KEY: ((r2.secret-access-key))
          REPOSITORY: private
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: amazon/aws-cli
              tag: latest
          run:
            path: bash
            args:
              - -c
              - |-
                set -euo pipefail

                export AWS_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}"
                export AWS_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}"

                s3() {
                  aws s3 --endpoint-url "${R2_ENDPOINT}" "$@"
                }

                workdir="$(mktemp -d)"
                cd "${workdir}"

                # Fetch the current repository database so we can confirm which version of each
                # package is the one the repository actually references.
                s3 cp "s3://${BUCKET}/${REPOSITORY}.db.tar.gz" ./db.tar.gz
                mkdir -p db
                tar -xzf ./db.tar.gz -C db

                # The database contains one directory per package, named "<pkgname>-<version>";
                # record the referenced package filename for each entry.
                referenced="$(mktemp)"
                for desc in db/*/desc; do
                  [ -f "${desc}" ] || continue
                  awk '/^%FILENAME%$/{getline; print}' "${desc}" >> "${referenced}"
                done

                # List every package file currently in the bucket.
                present="$(mktemp)"
                s3 ls "s3://${BUCKET}/" --recursive \
                  | awk '{print $4}' \
                  | grep -E '\.pkg\.tar\.zst$' > "${present}" || true

                # For each package file present in the bucket that is NOT the version referenced
                # by the database, remove it and its signature. The database is the source of
                # truth for the current version, so anything it does not reference is an older
                # version safe to delete.
                while IFS= read -r object; do
                  [ -n "${object}" ] || continue
                  filename="$(basename "${object}")"
                  if grep -qxF "${filename}" "${referenced}"; then
                    continue
                  fi
                  echo "Removing superseded package: ${object}"
                  s3 rm "s3://${BUCKET}/${object}"
                  s3 rm "s3://${BUCKET}/${object}.sig" || true
                done < "${present}"
    on_failure:
      task: notify-failed
      params:
        WEBHOOK_URL: ((webhooks/ntfy.url))
      config:
        platform: linux
        image_resource:
          type: registry-image
          source:
            repository: curlimages/curl
        inputs:
          - name: meta
        run:
          path: sh
          args:
            - -c
            - |-
              set -u
              meta() {
                cat "meta/$1" 2>/dev/null || true
              }
              build_url() {
                printf '%s/teams/%s/pipelines/%s/jobs/%s/builds/%s' \
                  "$(meta atc-external-url)" \
                  "$(meta build-team-name)" \
                  "$(meta build-pipeline-name)" \
                  "$(meta build-job-name)" \
                  "$(meta build-name)"
              }
              export PIPELINE_STATUS="failed"
              export PIPELINE_URL="$(build_url)"
              export REPOSITORY="private"
              curl --fail --silent --show-error \
                --header "Title: Cleanup of ${REPOSITORY} failed" \
                --data "Cleanup failed. See ${PIPELINE_URL}." \
                "${WEBHOOK_URL}" || true
